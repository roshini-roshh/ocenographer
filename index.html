<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean AI - Potential Fishing Zone Dashboard</title>

    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="MarkerCluster.css" />
    <link rel="stylesheet" href="MarkerCluster.Default.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100vw; background-color: #0a192f; }
        
        .info-card {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 18px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 340px;
            box-sizing: border-box;
            max-height: 90vh;
            overflow-y: auto;
        }
        .info-card h3 { margin: 0 0 10px 0; color: #0A2540; font-size: 18px; }

        .boat-btn {
            width: 100%;
            padding: 10px 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            margin-bottom: 8px;
        }
        .boat-btn:hover { background: #218838; }

        .download-btn {
            width: 100%;
            padding: 9px 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            margin-bottom: 12px;
        }
        .download-btn:hover { background: #0056b3; }

        .status-box {
            font-size: 11px;
            color: #333;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .location-form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .location-form input { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; }
        .location-form button { grid-column: 1 / -1; padding: 7px; border: 0; border-radius: 5px; background: #495057; color: white; cursor: pointer; font-size: 11px; }
        .safety-warning { color: #8a1c1c; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 4px; padding: 7px; font-size: 11px; margin-bottom: 8px; }

        .section-label {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .language-select, .query-select {
            width: 100%;
            padding: 8px;
            font-size: 11px;
            background: #fff;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .language-continue {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 0;
            border-radius: 6px;
            background: #007bff;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .language-continue:hover { background: #0056b3; }

        .chat-container { border-top: 1px solid #e9ecef; padding-top: 10px; }
        #chat-messages {
            height: 110px;
            overflow-y: auto;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 6px;
            font-size: 11px;
            margin-bottom: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="info-card">
        <h3 id="app-title">Ocean Analytics</h3>
        
        <button id="gps-button" class="boat-btn" onclick="locateBoat()">⚓ Locate My Boat GPS</button>
        <div class="location-form">
            <input type="number" id="manual-lat" placeholder="Latitude (e.g. 10.2)" step="any" min="-90" max="90">
            <input type="number" id="manual-lon" placeholder="Longitude (e.g. 79.2)" step="any" min="-180" max="180">
            <button id="manual-button" onclick="setManualLocation()">Set manual location</button>
        </div>
        <div id="safety-warning" class="safety-warning">Set GPS, enter coordinates, or click the map before asking a location-based question. Always follow official marine warnings.</div>
        <button id="download-button" class="download-btn" onclick="autoDownloadVoyageArea()">📥 Download Voyage Map Pack</button>

        <div id="status-box" class="status-box">
            GPS status: <em>Click above to find your position.</em>
        </div>

        <div class="section-label" id="language-label">Enter your preferred language</div>
        <select id="language-select" class="language-select">
            <option value="en">English</option>
            <option value="ml">മലയാളം</option>
            <option value="ta">தமிழ்</option>
            <option value="hi">हिन्दी</option>
        </select>
        <button id="language-continue" class="language-continue" onclick="proceedWithLanguage()">Continue in this language</button>

        <div class="chat-container">
            <div class="section-label" id="chat-label">Ocean AI Multilingual Chat</div>
            <select id="query-select" class="query-select" onchange="useSuggestedQuery(this.value)">
                <option value="">Choose a question</option>
            </select>
            <div id="chat-messages">
                <div><strong>AI:</strong> Ask about weather, safety, tides, or routes.</div>
            </div>
            <div style="display: flex; gap: 6px;">
                <input type="text" id="chat-input" placeholder="Ask anything (weather, routes...)" style="flex: 1; padding: 6px; font-size: 11px; border: 1px solid #ccc; border-radius: 4px;" onkeypress="if(event.key === 'Enter') sendChatMessage()" />
                <button id="send-button" onclick="sendChatMessage()" style="padding: 6px 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 11px; cursor: pointer;">Send</button>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="leaflet.js"></script>
    <script src="leaflet.markercluster.js"></script>

        function useSuggestedQuery(query) {
            if (query) document.getElementById("chat-input").value = query;
        }

        function proceedWithLanguage() {
            applyLanguage(document.getElementById("language-select").value);
            setStatus("<b>Language selected.</b> You can now continue with the map and chat in your preferred language.");
        }

        function applyLanguage(language) {
            selectedLanguage = translations[language] ? language : "en";
            const text = translations[selectedLanguage];
            document.documentElement.lang = selectedLanguage;
            document.getElementById("app-title").textContent = text.title;
            document.getElementById("gps-button").textContent = text.gps;
            document.getElementById("manual-button").textContent = text.manual;
            document.getElementById("safety-warning").textContent = text.warning;
            document.getElementById("download-button").textContent = text.download;
            document.getElementById("language-label").textContent = text.language;
            document.getElementById("language-continue").textContent = text.continue;
            document.getElementById("chat-label").textContent = text.chat;
            document.getElementById("chat-input").placeholder = text.placeholder;
            document.getElementById("send-button").textContent = text.send;
            const querySelect = document.getElementById("query-select");
            querySelect.innerHTML = `<option value="">${text.choose}</option>`;
            text.queries.forEach(query => {
                const option = document.createElement("option");
                option.value = query;
                option.textContent = query;
                querySelect.appendChild(option);
            });
            document.getElementById("chat-messages").innerHTML = `<div><strong>AI:</strong> ${text.intro}</div>`;
        }

        function setStatus(htmlContent) {
            document.getElementById("status-box").innerHTML = htmlContent;
        }

        function locateBoat() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { 
                        boatLat = pos.coords.latitude; 
                        boatLon = pos.coords.longitude; 
                        updateBoatOnMap(boatLat, boatLon); 
                    },
                    () => setStatus("<b>GPS permission denied.</b> Enter latitude and longitude manually or click your location on the map.")
                );
            } else {
                setStatus("<b>GPS is not available.</b> Enter latitude and longitude manually or click your location on the map.");
            }
        }

        function setManualLocation() {
            const lat = Number(document.getElementById("manual-lat").value);
            const lon = Number(document.getElementById("manual-lon").value);
            if (!Number.isFinite(lat) || !Number.isFinite(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
                setStatus("<b>Invalid location.</b> Latitude must be -90 to 90 and longitude must be -180 to 180.");
                return;
            }
            boatLat = lat;
            boatLon = lon;
            updateBoatOnMap(lat, lon, "Manual location");
        }

        function updateBoatOnMap(lat, lon, source = "GPS location") {
            if (boatMarker) window.map.removeLayer(boatMarker);
            boatMarker = L.marker([lat, lon], {
                icon: L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color:#FF3333; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 12px #FF3333;"></div>`,
                    iconSize: [16, 16], iconAnchor: [8, 8]
                })
            }).addTo(window.map).bindPopup(`<b>⚓ Your Boat Location</b><br>${lat.toFixed(4)}°N, ${lon.toFixed(4)}°E`).openPopup();

            window.map.flyTo([lat, lon], 9);
            setStatus(`<b>⚓ ${source} set:</b><br/>Latitude: ${lat.toFixed(4)}<br/>Longitude: ${lon.toFixed(4)}<br/><em>Location is ready for PFZ queries.</em>`);
        }

        async function autoDownloadVoyageArea() {
            if (boatLat === null || boatLon === null) {
                setStatus("<b>Location required.</b> Set your location before downloading a voyage area.");
                return;
            }
            setStatus("<b>[PORT MODE] Auto-downloading map tiles for voyage...</b>");
            
            const z = 8;
            const centerTileX = Math.floor((boatLon + 180) / 360 * Math.pow(2, z));
            const centerTileY = Math.floor((1 - Math.log(Math.tan(boatLat * Math.PI / 180) + 1 / Math.cos(boatLat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z));
            
            let fetched = 0;
            for (let x = centerTileX - 2; x <= centerTileX + 2; x++) {
                for (let y = centerTileY - 2; y <= centerTileY + 2; y++) {
                    const tileUrl = `https://a.tile.openstreetmap.org/${z}/${x}/${y}.png`;
                    fetch(tileUrl).catch(() => {});
                    fetched++;
                }
            }
            setStatus(`<b>✅ ${fetched} Map tiles saved locally! Ready for offshore voyage.</b>`);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function filterNearest(speciesType, lang) {
            if (boatLat === null || boatLon === null) {
                setStatus("<b>Location required.</b> Set GPS, enter coordinates, or click the map first.");
                return;
            }
            if (!geoJsonFeatures || geoJsonFeatures.length === 0) {
                setStatus("<em>Loading PFZ points data...</em>");
                return;
            }

            let closestPt = null;
            let minDistance = Infinity;

            geoJsonFeatures.forEach(feat => {
                const coords = feat.geometry.coordinates;
                const dist = calculateDistance(boatLat, boatLon, coords[1], coords[0]);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestPt = { lat: coords[1], lon: coords[0], sst: feat.properties.sst, chl: feat.properties.chl, dist: dist };
                }
            });

            if (closestPt) {
                if (routeLine) window.map.removeLayer(routeLine);
                routeLine = L.polyline([[boatLat, boatLon], [closestPt.lat, closestPt.lon]], {
                    color: "#ffb000", weight: 3, dashArray: "8 8"
                }).addTo(window.map);
                window.map.flyTo([closestPt.lat, closestPt.lon], 9, { animate: true, duration: 1.5 });
                setTimeout(() => {
                    L.popup()
                        .setLatLng([closestPt.lat, closestPt.lon])
                        .setContent(`<b>🌟 Target Hotspot (${lang})</b><br>GPS: ${closestPt.lat.toFixed(4)}°N, ${closestPt.lon.toFixed(4)}°E<br>Distance: <b>${closestPt.dist.toFixed(1)} km</b>`)
                        .openOn(window.map);
                }, 1600);
                setStatus(`<b>Closest Hotspot (${lang}):</b><br/>Distance: <b>${closestPt.dist.toFixed(1)} km</b><br/>SST: ${closestPt.sst}°C | Chlorophyll: ${closestPt.chl} mg/m³`);
            }
        }

        async function sendChatMessage() {
            const inputField = document.getElementById("chat-input");
            const msgContainer = document.getElementById("chat-messages");
            const prompt = inputField.value.trim();
            if (!prompt) return;

            if (boatLat === null || boatLon === null) {
                msgContainer.innerHTML += `<div style="color:#8a1c1c;"><strong>AI:</strong> Please set your location with GPS, manual coordinates, or map selection before asking this question.</div>`;
                return;
            }

            msgContainer.innerHTML += `<div><strong>You:</strong> ${prompt}</div>`;
            inputField.value = "";
            msgContainer.scrollTop = msgContainer.scrollHeight;

            try {
                const res = await fetch('http://127.0.0.1:8000/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, boat_lat: boatLat, boat_lon: boatLon, language: selectedLanguage })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || "Request failed");
                msgContainer.innerHTML += `<div><strong>AI (${data.mode}):</strong> ${data.response.replace(/\n/g, '<br/>')}</div>`;
            } catch (err) {
                msgContainer.innerHTML += `<div style="color:red;"><strong>Error:</strong> ${err.message || "Backend unreachable."}</div>`;
            }
            msgContainer.scrollTop = msgContainer.scrollHeight;
        }

        const map = L.map('map', { center: [10.2, 79.2], zoom: 7, maxZoom: 13, minZoom: 4 });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
        window.map = map;
        map.on("click", (event) => {
            boatLat = event.latlng.lat;
            boatLon = event.latlng.lng;
            document.getElementById("manual-lat").value = boatLat.toFixed(6);
            document.getElementById("manual-lon").value = boatLon.toFixed(6);
            updateBoatOnMap(boatLat, boatLon, "Map-selected location");
        });

        const pfzIcon = L.divIcon({
            className: 'custom-pin',
            html: `<div style="background-color:#00E5FF; width:12px; height:12px; border-radius:50%; border:2px solid white; box-shadow:0 0 10px #00E5FF;"></div>`,
            iconSize: [12, 12], iconAnchor: [6, 6]
        });

        const markers = L.markerClusterGroup({ disableClusteringAtZoom: 9 });
        fetch('pfz_points.geojson')
            .then(res => res.json())
            .then(data => {
                geoJsonFeatures = data.features || [];
                const geoJsonLayer = L.geoJSON(data, {
                    pointToLayer: (feature, latlng) => L.marker(latlng, { icon: pfzIcon }),
                    onEachFeature: (feature, layer) => {
                        const props = feature.properties;
                        layer.bindPopup(`<b>Potential Fishing Zone</b><br/>GPS: ${feature.geometry.coordinates[1].toFixed(4)}°N, ${feature.geometry.coordinates[0].toFixed(4)}°E<br/>SST: ${props.sst} °C | Chlorophyll: ${props.chl} mg/m³`);
                    }
                });
                markers.addLayer(geoJsonLayer);
                map.addLayer(markers);
            })
            .catch(() => setStatus("<em>GeoJSON load warning: Ensure pfz_points.geojson exists.</em>"));
        applyLanguage("en");
    </script>
